# Production is Render (leads.adhello.io / adhelloleadsos.onrender.com).
# Render auto-deploys from `main` via the GitHub integration.
# Optional secrets:
#   RENDER_DEPLOY_HOOK — trigger a Render deploy explicitly
#   GCP_SA_KEY         — also deploy to Cloud Run (secondary / unused in prod)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "No RENDER_DEPLOY_HOOK secret — relying on Render GitHub auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Triggered Render deploy hook."

      - name: Detect optional Cloud Run credentials
        id: gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "${GCP_SA_KEY}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No GCP_SA_KEY — skipping Cloud Run (production is Render)."
          fi

      - name: Authenticate to Google Cloud
        if: steps.gcp.outputs.has_key == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        if: steps.gcp.outputs.has_key == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: adhello-leadsos
          region: us-west1
          source: .
          env_vars: ASSET_VERSION=${{ github.sha }}

      - name: Verify production (Render)
        run: |
          set -euo pipefail
          EXPECTED="$(node -p "require('./package.json').version")"
          echo "Expecting package version ${EXPECTED} on production"
          ok=0
          for i in $(seq 1 36); do
            html="$(curl -fsS https://leads.adhello.io/auth/login || true)"
            if printf '%s' "$html" | grep -q "v=${EXPECTED}"; then
              echo "Production is live at v=${EXPECTED}"
              ok=1
              break
            fi
            echo "Attempt ${i}: production not on v=${EXPECTED} yet; waiting 10s"
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "Timed out waiting for leads.adhello.io to serve v=${EXPECTED}"
            exit 1
          fi
          curl -fsS https://leads.adhello.io/health
          echo
