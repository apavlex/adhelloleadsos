# One-shot deploy (from repo root):
#   gcloud builds submit --config cloudbuild.yaml .
#
substitutions:
  _REGION: us-west1
  _SERVICE: adhello-leadsos

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
