<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFDB3A">
  <title>Offline — AdHello</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, sans-serif;
      background: #FAF7ED;
      color: #0F172A;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #020617; color: #f8fafc; }
    }
    img { width: 72px; height: 72px; border-radius: 22%; margin-bottom: 1.25rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.5rem; color: #64748b; font-size: 0.95rem; line-height: 1.5; max-width: 22rem; }
    button {
      appearance: none;
      border: none;
      background: #FFDB3A;
      color: #111827;
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <img src="/images/adhello-app-icon-192.png" alt="AdHello" width="72" height="72">
    <h1>You're offline</h1>
    <p>AdHello needs a connection to load your workspace. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
