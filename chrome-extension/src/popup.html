<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdHello Leads</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <h1>AdHello Leads</h1>
      <p id="platformLabel">Detecting page…</p>
      <p id="saveTypeLabel" class="save-type hidden"></p>
    </header>

    <div id="setupNotice" class="notice notice--warn hidden">
      Set your API key in <a href="#" id="openOptions">Settings</a> before saving.
    </div>

    <form id="leadForm">
      <label>
        <span>Title</span>
        <input type="text" name="title" required />
      </label>
      <label>
        <span>Headline / notes</span>
        <textarea name="note" rows="3"></textarea>
      </label>
      <label>
        <span>Address</span>
        <input type="text" name="address" />
      </label>
      <div class="row-2">
        <label>
          <span>City</span>
          <input type="text" name="city" />
        </label>
        <label>
          <span>State</span>
          <input type="text" name="state" />
        </label>
      </div>
      <label>
        <span>Website</span>
        <input type="url" name="website" placeholder="https://" />
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" />
      </label>
      <label>
        <span>Phone</span>
        <input type="tel" name="phone" />
      </label>
      <label>
        <span>Reviews</span>
        <input type="text" name="reviews" placeholder="4.5★ · 120 reviews" />
      </label>

      <section class="form-section" aria-labelledby="listingSectionTitle">
        <h2 id="listingSectionTitle" class="form-section__title">Real estate &amp; products</h2>
        <p class="form-section__hint">Optional — for Zillow, MHVillage, OfferUp, and other listings.</p>
        <label>
          <span>Price</span>
          <input type="text" name="price" placeholder="$0" />
        </label>
        <div class="row-3">
          <label>
            <span>Beds</span>
            <input type="text" name="beds" />
          </label>
          <label>
            <span>Baths</span>
            <input type="text" name="baths" />
          </label>
          <label>
            <span>Sqft</span>
            <input type="text" name="sqft" />
          </label>
        </div>
      </section>

      <button type="submit" id="saveBtn">Save to AdHello</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
